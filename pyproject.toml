[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-fock-vsap"
version = "0.1.0"
description = "Machine learning of molecular Fock matrices with SAIAO-vSAP features"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-only"}
authors = [
  {name = "Chaoqun Zhang"},
  {name = "Christian Venturella"},
  {name = "Enzhi Chen"},
  {name = "Tianyu Zhu"},
]
dependencies = [
  "joblib>=1.3",
  "matplotlib>=3.8",
  "mpi4py>=3.1",
  "numpy>=1.26",
  "pandas>=2.0",
  "psutil>=5.9",
  "pyscf>=2.8",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "torch>=2.2",
  "torch-geometric>=2.5",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["mlvk*"]

[tool.setuptools.package-data]
mlvk = ["basis/minao_cvs/*.dat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
